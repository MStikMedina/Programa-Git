<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Terceros{% endblock %} · AAMO</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1f2933; }
    header { background: #1f3a5f; color: #fff; padding: 14px 24px; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e4e7eb; text-align: left; }
    th { background: #e4ecf5; }
    .btn { display: inline-block; padding: 6px 12px; border: 0; border-radius: 4px; background: #1f3a5f;
           color: #fff; text-decoration: none; cursor: pointer; font-size: 14px; }
    .btn-peligro { background: #b3261e; }
    .btn-gris { background: #6b7280; }
    .mensaje { padding: 10px 14px; border-radius: 4px; margin-bottom: 12px; }
    .mensaje.success { background: #d9f2e3; }
    .mensaje.error { background: #fbdcd9; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input[type=text], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    form.filtro { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  </style>
</head>
<body>
  <header><strong>AAMO</strong> · Logística · Terceros</header>
  <main>
    {% for mensaje in messages %}
      <div class="mensaje {{ mensaje.tags }}">{{ mensaje }}</div>
    {% endfor %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
