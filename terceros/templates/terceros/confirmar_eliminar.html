{% extends 'terceros/base.html' %}
{% block titulo %}Eliminar tercero{% endblock %}
{% block contenido %}
  <h1>Eliminar tercero</h1>
  <p>¿Seguro que deseas eliminar a <strong>{{ tercero.nombre }}</strong>? Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-peligro" type="submit">Sí, eliminar</button>
    <a class="btn btn-gris" href="{% url 'terceros:lista' %}">Cancelar</a>
  </form>
{% endblock %}
